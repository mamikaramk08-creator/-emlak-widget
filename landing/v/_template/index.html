<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Template for a personalized demo page. Copy this folder to
     landing/v/<their-slug>/, drop their demo.mp4 next to it, replace
     ACME REALTY below, then redeploy landing/. Only build one of these
     for a prospect who actually replied. -->
<title>Acme Realty — 75-second walkthrough</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --primary: #0B5FFF; --ink: #14161c; --paper: #FAF7F2; --accent: #A9803F; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 72px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    background-image: radial-gradient(rgba(20,22,28,.06) 1px, transparent 1px);
    background-size: 24px 24px;
    text-align: center;
  }
  .eyebrow {
    display: block;
    text-transform: uppercase;
    letter-spacing: .18em;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 32px;
    margin: 0 0 12px;
  }
  p.lead { color: #666; font-size: 15px; max-width: 560px; margin: 0 auto 40px; }
  video {
    display: block;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    aspect-ratio: 16 / 9;
    background: #14161c;
    border-radius: 14px;
    border: 1px solid #ece5d8;
    box-shadow: 0 18px 50px rgba(15,23,42,.12);
  }
  .cta {
    display: inline-block;
    margin-top: 40px;
    background: var(--primary);
    color: #fff;
    padding: 14px 30px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
  }
  .note { color: #888; font-size: 13px; margin-top: 28px; }
  .note a { color: #888; }
</style>
</head>
<body>

<span class="eyebrow">Made for Acme Realty</span>
<h1>Your site, with the widget on it.</h1>
<p class="lead">75 seconds. This is a recording of your own homepage — the widget was running live in my browser, nothing was installed on your end.</p>

<video controls playsinline preload="metadata">
  <source src="demo.mp4" type="video/mp4">
  Your browser can't play this video.
</video>

<a class="cta" href="https://getboxagent.com/#pricing">See pricing &amp; start the trial</a>

<p class="note">$0 setup &middot; 7-day free trial &middot; <a href="https://getboxagent.com/">getboxagent.com</a></p>

</body>
</html>
